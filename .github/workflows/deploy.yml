name: Deploy na Webglobe (SFTP)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sestaveni a nahrani na server
    runs-on: ubuntu-latest
    steps:
      - name: Stazeni kodu z GitHubu
        uses: actions/checkout@v4

      - name: Nastaveni Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalace zavislosti
        run: bun install

      - name: Sestaveni projektu (Build)
        run: bun run build

      - name: Nahrani na Webglobe pres SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 222
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_path: './dist/*'
          remote_path: '/public_html'
          sftpArgs: '-o ConnectTimeout=60'
