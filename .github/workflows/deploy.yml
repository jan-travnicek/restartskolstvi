name: Deploy na Webglobe

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sestaveni a nahrani na server
    runs-on: ubuntu-latest
    steps:
      - name: Stazeni kodu z GitHubu
        uses: actions/checkout@v4

      - name: Nastaveni Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalace zavislosti
        run: bun install

      - name: Sestaveni projektu (Build)
        run: bun run build

      - name: Overeni HTML pro FTP
        id: static-output
        run: bun scripts/check-static-output.ts >> "$GITHUB_OUTPUT"

      - name: Nahrani na Webglobe pres FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ steps.static-output.outputs.directory }}
          server-dir: public_html/
